name: drivebox

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin", "--quiet", "--eval"]
    command:
      - |
        try {
          rs.status();
        } catch (error) {
          if (error.code !== 94) throw error;
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
        }
        let ready = false;
        for (let attempt = 0; attempt < 60; attempt++) {
          if (db.hello().isWritablePrimary) { ready = true; break; }
          sleep(1000);
        }
        if (!ready) throw new Error('Replica set did not elect a primary');
    restart: "no"

  app:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4000"
      CLIENT_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:4000}"
      MONGODB_URI: mongodb://mongo:27017/drivebox?replicaSet=rs0
      STORAGE_DIR: /data/uploads
      SESSION_SECRET: "${SESSION_SECRET:?Run npm run setup to generate .env first}"
      SESSION_DAYS: "${SESSION_DAYS:-7}"
      DEFAULT_QUOTA_BYTES: "${DEFAULT_QUOTA_BYTES:-104857600}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-26214400}"
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    volumes:
      - upload-data:/data/uploads
    restart: unless-stopped

volumes:
  mongo-data:
  upload-data:
